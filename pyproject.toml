[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boomearth"
version = "0.1.0"
description = "BoomEarth V1 local-first video workbench"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "dashscope>=1.20,<2",
    "pillow>=11,<13",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boomearth"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
